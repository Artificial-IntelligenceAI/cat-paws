<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Cat Paws</title>

    <!-- wasm-opt runs on release builds only; dev builds stay fast. -->
    <link data-trunk rel="rust" data-wasm-opt="z" />

    <style>
        html,
        body {
            overflow: hidden;
            margin: 0 !important;
            padding: 0 !important;
            height: 100%;
            width: 100%;
        }

        /* Solarized base03, so the page matches the app before WASM loads. */
        body {
            background: #002b36;
        }

        canvas {
            margin-right: auto;
            margin-left: auto;
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: ui-monospace, monospace;
            font-size: 14px;
            color: #586e75;
        }
    </style>
</head>

<body>
    <canvas id="the_canvas_id"></canvas>
    <div class="loading" id="loading">loading Cat Paws&hellip;</div>
    <script>
        // The right mouse button pans the canvas, so the browser's own context
        // menu must not appear on right-press.
        document.addEventListener("DOMContentLoaded", () => {
            const canvas = document.getElementById("the_canvas_id");
            if (canvas) {
                canvas.addEventListener("contextmenu", (e) => e.preventDefault());
            }
        });

        // Remove the loading text once the canvas has been painted at least once.
        document.addEventListener("DOMContentLoaded", () => {
            const observer = new MutationObserver(() => {
                const el = document.getElementById("loading");
                if (el) el.remove();
            });
            observer.observe(document.getElementById("the_canvas_id"), { attributes: true });
            setTimeout(() => {
                const el = document.getElementById("loading");
                if (el) el.remove();
            }, 4000);
        });
    </script>
</body>

</html>
